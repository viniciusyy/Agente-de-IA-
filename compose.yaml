
services:
  db:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pasteis_miyata
      MYSQL_USER: ${DEMO_MYSQL_USER}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD}
    volumes:
      - mysql_demo:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: pasteis_miyata
      MYSQL_USER: ${DEMO_MYSQL_USER}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD}
      CHECKPOINT_DATABASE: /app/dados/estado/checkpoints.sqlite3
      MEMORY_DATABASE: /app/dados/estado/memoria.sqlite3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - agente_estado:/app/dados/estado
      - ./logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  mysql_demo:
  agente_estado:
